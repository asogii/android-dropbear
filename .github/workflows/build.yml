name: Build Dropbear KSU Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install NDK 30.0.14904198
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;30.0.14904198" >/dev/null

      - name: Build Dropbear Binaries
        run: |
          chmod +x build
          ./build

      - name: Package KernelSU Module ZIP
        run: |
          VER=$(cat dropbear-version)
          mkdir -p module/bin
          cp dropbear/dropbear dropbear/dbclient dropbear/dropbearkey dropbear/dropbearconvert dropbear/scp module/bin/

          cat << EOF > module/module.prop
          id=dropbear_ssh
          name=Dropbear SSH Server
          version=$VER
          versionCode=1
          author=asogii
          description=Dropbear SSH server and client tools ($VER) for Android 16
          EOF

          cat << 'EOF' > module/customize.sh
          MODID="dropbear_ssh"
          OLD_MOD="/data/adb/modules/$MODID"
          HOME_DIR="/data/adb/home"

          pkill -x dropbear >/dev/null 2>&1 || true

          set_perm "$MODPATH/boot-completed.sh" 0 0 0755
          set_perm_recursive "$MODPATH/bin" 0 0 0755 0755

          mkdir -p "$HOME_DIR/.ssh" "$HOME_DIR/.local/bin"
          chmod 700 "$HOME_DIR" "$HOME_DIR/.ssh"

          if [ -f "$OLD_MOD/dropbear_ed25519_host_key" ]; then
              cp -af "$OLD_MOD/dropbear_ed25519_host_key" "$MODPATH/"
          elif [ -f "/data/adb/dropbear/dropbear_ed25519_host_key" ]; then
              cp -af "/data/adb/dropbear/dropbear_ed25519_host_key" "$MODPATH/"
          else
              "$MODPATH/bin/dropbearkey" -t ed25519 -f "$MODPATH/dropbear_ed25519_host_key" >/dev/null 2>&1
          fi
          set_perm "$MODPATH/dropbear_ed25519_host_key" 0 0 0600
          EOF

          cat << 'EOF' > module/boot-completed.sh
          #!/system/bin/sh
          MODDIR=${0%/*}
          exec "$MODDIR/bin/dropbear"
          EOF

          cd module && zip -r ../dropbear-ksu.zip .

      - uses: actions/upload-artifact@v7
        with:
          name: dropbear-ksu-module
          path: dropbear-ksu.zip
          archive: false
